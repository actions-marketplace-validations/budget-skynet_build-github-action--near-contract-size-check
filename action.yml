name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory or main.rs file"
    required: true
    default: ''
  size_limit_bytes:
    description: "Maximum allowed contract size in bytes"
    required: false
    default: '4194304'
  warning_threshold_percent:
    description: "Percentage of size limit at which to warn (e.g., 80)"
    required: false
    default: '80'
  baseline_artifact:
    description: "Previous build artifact or commit to compare size against"
    required: false
    default: ''
  fail_on_exceeded:
    description: "Whether to fail the action if contract exceeds size limit"
    required: false
    default: 'true'
  optimization_level:
    description: "Cargo optimization level (release or lto)"
    required: false
    default: 'release'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_SIZE_LIMIT_BYTES: ${{ inputs.size_limit_bytes }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
        INPUT_FAIL_ON_EXCEEDED: ${{ inputs.fail_on_exceeded }}
        INPUT_OPTIMIZATION_LEVEL: ${{ inputs.optimization_level }}