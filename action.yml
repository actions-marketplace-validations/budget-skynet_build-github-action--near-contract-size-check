name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory or Cargo.toml file"
    required: true
    default: ''
  wasm_size_limit_kb:
    description: "Maximum allowed WASM contract size in kilobytes"
    required: false
    default: '4096'
  warning_threshold_percent:
    description: "Percentage of size limit to trigger warning (0-100)"
    required: false
    default: '80'
  baseline_artifact:
    description: "Path or artifact name of previous build WASM for size comparison"
    required: false
    default: ''
  fail_on_limit_exceeded:
    description: "Whether to fail the action if contract exceeds size limit"
    required: false
    default: 'true'
  optimization_suggestions:
    description: "Whether to include optimization suggestions in the report"
    required: false
    default: 'true'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_WASM_SIZE_LIMIT_KB: ${{ inputs.wasm_size_limit_kb }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
        INPUT_FAIL_ON_LIMIT_EXCEEDED: ${{ inputs.fail_on_limit_exceeded }}
        INPUT_OPTIMIZATION_SUGGESTIONS: ${{ inputs.optimization_suggestions }}