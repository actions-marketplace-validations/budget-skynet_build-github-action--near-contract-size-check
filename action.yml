name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory containing Cargo.toml"
    required: true
    default: ''
  size_limit_bytes:
    description: "Maximum allowed WASM contract size in bytes (default NEAR limit is 50MB)"
    required: false
    default: '52428800'
  warning_threshold_percent:
    description: "Percentage of size limit to trigger warning (e.g., 80 for 80%)"
    required: false
    default: '80'
  compare_with_branch:
    description: "Branch name to compare current size against for size regression detection"
    required: false
    default: 'main'
  fail_on_limit:
    description: "Whether to fail the action if contract exceeds size limit"
    required: false
    default: 'true'
  optimization_suggestions:
    description: "Enable optimization suggestions in the output report"
    required: false
    default: 'true'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_SIZE_LIMIT_BYTES: ${{ inputs.size_limit_bytes }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_COMPARE_WITH_BRANCH: ${{ inputs.compare_with_branch }}
        INPUT_FAIL_ON_LIMIT: ${{ inputs.fail_on_limit }}
        INPUT_OPTIMIZATION_SUGGESTIONS: ${{ inputs.optimization_suggestions }}