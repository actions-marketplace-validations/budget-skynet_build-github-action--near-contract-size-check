name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory or WASM file to check"
    required: true
    default: ''
  size_limit_kb:
    description: "Maximum allowed contract size in kilobytes (NEAR limit is typically 4096 KB)"
    required: false
    default: '4096'
  warning_threshold_percent:
    description: "Percentage of size limit at which to warn (e.g., 80 means warn at 80% of limit)"
    required: false
    default: '80'
  baseline_wasm_url:
    description: "URL or path to previous build WASM for size comparison"
    required: false
    default: ''
  fail_on_limit_exceeded:
    description: "Whether to fail the action if size exceeds the limit"
    required: false
    default: 'true'
  optimization_suggestions:
    description: "Enable detailed optimization recommendations in output"
    required: false
    default: 'true'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_SIZE_LIMIT_KB: ${{ inputs.size_limit_kb }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_BASELINE_WASM_URL: ${{ inputs.baseline_wasm_url }}
        INPUT_FAIL_ON_LIMIT_EXCEEDED: ${{ inputs.fail_on_limit_exceeded }}
        INPUT_OPTIMIZATION_SUGGESTIONS: ${{ inputs.optimization_suggestions }}