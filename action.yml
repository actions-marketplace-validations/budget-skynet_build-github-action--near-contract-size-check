name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory or WASM file to check"
    required: true
    default: ''
  size_limit_kb:
    description: "Maximum allowed contract size in kilobytes before failing"
    required: false
    default: '4096'
  warning_threshold_percent:
    description: "Percentage of size limit at which to issue a warning (e.g., 80 for 80%)"
    required: false
    default: '80'
  compare_with_previous:
    description: "Enable comparison with previous build size from artifacts or git history"
    required: false
    default: 'true'
  optimization_suggestions:
    description: "Enable automated optimization suggestions for oversized contracts"
    required: false
    default: 'true'
  fail_on_limit_exceeded:
    description: "Fail the workflow if contract size exceeds the limit"
    required: false
    default: 'true'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_SIZE_LIMIT_KB: ${{ inputs.size_limit_kb }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_COMPARE_WITH_PREVIOUS: ${{ inputs.compare_with_previous }}
        INPUT_OPTIMIZATION_SUGGESTIONS: ${{ inputs.optimization_suggestions }}
        INPUT_FAIL_ON_LIMIT_EXCEEDED: ${{ inputs.fail_on_limit_exceeded }}