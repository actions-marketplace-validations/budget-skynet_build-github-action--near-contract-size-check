name: "Build GitHub Action: NEAR Contract Size Check"
description: "## Overview Create a GitHub Action that checks NEAR contract WASM size and warns if approaching limits.  ## Why This Mat"

inputs:
  contract_path:
    description: "Path to the NEAR contract directory or WASM file to check"
    required: true
    default: ''
  size_limit_kb:
    description: "Maximum allowed contract size in kilobytes before failure"
    required: false
    default: '4096'
  warning_threshold_percent:
    description: "Percentage of size limit at which to issue a warning"
    required: false
    default: '75'
  baseline_artifact:
    description: "Previous build artifact or commit to compare contract size against"
    required: false
    default: ''
  fail_on_increase:
    description: "Whether to fail the action if contract size increased from baseline"
    required: false
    default: 'false'
  optimization_suggestions:
    description: "Enable automated optimization recommendations based on contract analysis"
    required: false
    default: 'true'

outputs:
  result:
    description: "Action execution result"
  status:
    description: "Pass or fail status"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: cd ${{ github.action_path }} && npm install --production
    - name: Run action
      shell: bash
      id: run
      run: cd ${{ github.action_path }} && node src/index.js
      env:
        INPUT_CONTRACT_PATH: ${{ inputs.contract_path }}
        INPUT_SIZE_LIMIT_KB: ${{ inputs.size_limit_kb }}
        INPUT_WARNING_THRESHOLD_PERCENT: ${{ inputs.warning_threshold_percent }}
        INPUT_BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
        INPUT_FAIL_ON_INCREASE: ${{ inputs.fail_on_increase }}
        INPUT_OPTIMIZATION_SUGGESTIONS: ${{ inputs.optimization_suggestions }}